name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Regenerate's commits are made with GITHUB_TOKEN, which does not trigger
  # push workflows, so CI never runs on them unless dispatched by hand.
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build
        run: mvn compile -q
